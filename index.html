<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101611">
  <title>ODDITY — roll your luck</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    :root {
      color-scheme: dark;
      --ink: #edf0dd;
      --muted: #929b8d;
      --page: #101611;
      --panel: #19221b;
      --panel-light: #202b22;
      --line: #344035;
      --lime: #cefa68;
      --mint: #86e2b1;
      --coral: #ff846c;
      --gold: #ffcf6e;
      --mono: "DM Mono", monospace;
      --sans: "Space Grotesk", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--page);
      background-image: radial-gradient(ellipse at 52% 37%, #263328 0, transparent 53%),
        repeating-linear-gradient(0deg, transparent, transparent 47px, #ffffff05 48px),
        repeating-linear-gradient(90deg, transparent, transparent 47px, #ffffff05 48px);
      font-family: var(--sans);
    }

    button { color: inherit; font: inherit; }
    .shell { width: min(1040px, calc(100% - 36px)); margin: 0 auto; padding: 30px 0 36px; }
    .topbar { display: flex; justify-content: space-between; align-items: center; gap: 20px; padding-bottom: 24px; border-bottom: 1px solid var(--line); }
    .brand { display: flex; align-items: center; gap: 12px; }
    .brand-mark { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--lime); color: var(--lime); font-size: 19px; transform: rotate(-8deg); }
    .brand-name { font-size: 17px; font-weight: 700; letter-spacing: 0; }
    .brand-tag { margin-top: 2px; color: var(--muted); font: 10px var(--mono); letter-spacing: 0; }
    .top-stats { display: flex; align-items: center; gap: 28px; }
    .top-stat { display: grid; gap: 4px; text-align: right; }
    .eyebrow { color: var(--muted); font: 10px var(--mono); text-transform: uppercase; letter-spacing: 0; }
    .top-stat strong { font: 500 15px var(--mono); }
    .shard-count { color: var(--gold); }

    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 18px; padding-top: 24px; align-items: start; }
    .main-column { min-width: 0; display: grid; gap: 16px; }
    .panel { border: 1px solid var(--line); background: #182119eF; }
    .machine { position: relative; min-height: 426px; overflow: hidden; padding: 22px 24px 25px; text-align: center; }
    .machine::before, .machine::after { position: absolute; width: 13px; height: 13px; content: ""; pointer-events: none; }
    .machine::before { top: 9px; left: 9px; border-top: 1px solid var(--lime); border-left: 1px solid var(--lime); }
    .machine::after { right: 9px; bottom: 9px; border-right: 1px solid var(--lime); border-bottom: 1px solid var(--lime); }
    .machine-label { display: flex; justify-content: space-between; color: var(--muted); font: 10px var(--mono); text-transform: uppercase; }
    .machine-label span:last-child { color: var(--mint); }
    .number-stage { position: relative; display: grid; place-items: center; height: 224px; margin: 11px 0 4px; isolation: isolate; }
    .number-stage.animations-off::after { animation: none; }
    .number-stage.animations-off .result-number { animation: none !important; }
    .number-stage::before { position: absolute; z-index: -1; width: 200px; aspect-ratio: 1; border: 1px solid #b7d28b1d; border-radius: 50%; content: ""; }
    .number-stage::after { position: absolute; z-index: -1; width: 250px; aspect-ratio: 1; border: 1px dashed #b7d28b12; border-radius: 50%; content: ""; animation: orbit 42s linear infinite; }
    .result-number { display: block; min-width: 200px; color: var(--lime); font-size: clamp(72px, 16vw, 132px); font-weight: 700; line-height: .9; font-variant-numeric: tabular-nums; text-shadow: 0 0 32px #cefa6830; transition: color .2s, text-shadow .2s; }
    .result-number.rolling { animation: roll .52s cubic-bezier(.2,.7,.2,1); }
    .result-number.jackpot { color: var(--gold); text-shadow: 0 0 20px #ffcf6e99, 0 0 70px #ffcf6e55; }
    .result-number.hex { color: var(--coral); text-shadow: 0 0 22px #ff846c99; }
    .result-number.cosmic { color: #91e4d4; text-shadow: 0 0 25px #91e4d488, 0 0 72px #91e4d455; }
    .result-number.perfect { color: #fff5bf; text-shadow: 0 0 30px #ffcf6e, 0 0 85px #ff846caa; animation: oneHundred .95s cubic-bezier(.15,.75,.2,1); }
    .result-number.mystery { color: #cfb9ff; text-shadow: 0 0 24px #cfb9ff99; }
    .result-number.passive-seven { animation: sevenSpark .9s cubic-bezier(.18,.8,.25,1); }
    .result-number.passive-thirteen { animation: hexFlicker .65s steps(2,end); }
    .result-number.passive-forty-two { animation: cosmicPulse 1.1s ease-out; }
    .result-number.passive-sixty-nine { animation: doubleBounce .8s ease-in-out; }
    .result-number.passive-hundred { animation: supernova 1.25s cubic-bezier(.15,.75,.2,1); }
    .result-caption { min-height: 24px; color: var(--muted); font: 11px var(--mono); }
    .result-caption.special { color: var(--gold); }
    .roll-button { display: inline-flex; align-items: center; justify-content: center; gap: 10px; width: min(100%, 290px); min-height: 52px; margin-top: 11px; border: 0; background: var(--lime); color: #182018; cursor: pointer; font-size: 14px; font-weight: 700; transition: background .18s, transform .18s; }
    .roll-button:hover:not(:disabled) { background: #e0ff9c; transform: translateY(-2px); }
    .roll-button:active:not(:disabled) { transform: translateY(0); }
    .roll-button:disabled { cursor: wait; opacity: .72; }
    .roll-button kbd { padding: 3px 6px; border: 1px solid #1820184d; font: 10px var(--mono); }
    .roll-subtext { margin-top: 9px; color: var(--muted); font: 10px var(--mono); }

    .stats-strip { display: grid; grid-template-columns: repeat(3, 1fr); }
    .stat-cell { min-width: 0; padding: 15px 18px; }
    .stat-cell + .stat-cell { border-left: 1px solid var(--line); }
    .stat-cell strong { display: block; margin-top: 8px; overflow: hidden; font: 500 18px var(--mono); text-overflow: ellipsis; white-space: nowrap; }
    .stat-cell:nth-child(2) strong { color: var(--mint); }
    .stat-cell:nth-child(3) strong { color: var(--gold); }

    .side-column { display: grid; gap: 16px; }
    .side-panel { padding: 17px; }
    .section-heading { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-bottom: 13px; border-bottom: 1px solid var(--line); }
    .section-heading h2 { margin: 0; font-size: 14px; font-weight: 600; }
    .section-heading span { color: var(--muted); font: 10px var(--mono); }
    .upgrade-list { display: grid; gap: 9px; padding-top: 12px; }
    .upgrade { display: grid; grid-template-columns: 36px minmax(0, 1fr) auto; align-items: center; gap: 10px; padding: 10px 9px; border: 1px solid #344035; background: #1c261e; }
    .upgrade-icon { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid #566249; color: var(--lime); font: 15px var(--mono); }
    .upgrade:nth-child(2) .upgrade-icon { color: var(--mint); border-color: #486c57; }
    .upgrade:nth-child(3) .upgrade-icon { color: var(--coral); border-color: #765047; }
    .upgrade:nth-child(4) .upgrade-icon { color: var(--gold); border-color: #766745; }
    .upgrade-copy { min-width: 0; }
    .upgrade-copy strong { display: block; font-size: 12px; font-weight: 600; }
    .upgrade-copy span { display: block; margin-top: 4px; color: var(--muted); font: 9px var(--mono); line-height: 1.5; }
    .buy-button { min-width: 64px; padding: 7px 6px; border: 1px solid #64754d; background: transparent; color: var(--lime); cursor: pointer; font: 10px var(--mono); }
    .buy-button:hover:not(:disabled) { background: #cefa6814; }
    .buy-button:disabled { border-color: var(--line); color: #737c70; cursor: not-allowed; }
    .pet-list, .material-list { display: grid; gap: 8px; padding-top: 12px; }
    .pet-card { display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 9px 8px; border: 1px solid var(--line); background: #1c261e; }
    .pet-mark { display: grid; place-items: center; width: 30px; height: 30px; border: 1px solid #566249; color: var(--mint); font-size: 16px; }
    .pet-card:nth-child(2) .pet-mark { color: var(--gold); }
    .pet-card:nth-child(3) .pet-mark { color: #8bd9e1; }
    .pet-card:nth-child(4) .pet-mark { color: #ffad84; }
    .pet-card:nth-child(5) .pet-mark, .pet-card:nth-child(9) .pet-mark { color: #d0b6ff; }
    .pet-card:nth-child(6) .pet-mark, .pet-card:nth-child(10) .pet-mark { color: var(--coral); }
    .pet-card:nth-child(7) .pet-mark, .pet-card:nth-child(11) .pet-mark { color: var(--gold); }
    .pet-card:nth-child(8) .pet-mark, .pet-card:nth-child(12) .pet-mark { color: #91e4d4; }
    .pet-copy { min-width: 0; }
    .pet-copy strong, .pet-copy span { display: block; }
    .pet-copy strong { font-size: 11px; }
    .pet-copy span { margin-top: 4px; color: var(--muted); font: 9px/1.4 var(--mono); }
    .pet-button { min-width: 65px; padding: 7px 5px; border: 1px solid #64754d; background: transparent; color: var(--lime); cursor: pointer; font: 9px var(--mono); }
    .pet-button:disabled { border-color: var(--line); color: #737c70; cursor: not-allowed; }
    .pet-button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
    .loadout-summary { margin-top: 11px; padding: 9px; border-left: 2px solid var(--mint); background: #86e2b10a; color: #c6d3c2; font: 9px/1.6 var(--mono); }
    .gacha-actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-top: 12px; }
    .gacha-button { min-height: 38px; padding: 6px; border: 1px solid #64754d; background: #cefa680c; color: var(--lime); cursor: pointer; font: 9px var(--mono); }
    .gacha-button:hover:not(:disabled) { background: #cefa681e; }
    .gacha-button:disabled { border-color: var(--line); color: #737c70; cursor: not-allowed; }
    .offer-card { margin-top: 12px; padding: 12px; border: 1px solid var(--gold); background: #ffcf6e0a; }
    .offer-card[hidden] { display: none; }
    .offer-label { color: var(--gold); font: 9px var(--mono); }
    .offer-card h3 { margin: 7px 0 4px; font-size: 15px; }
    .offer-stats { color: #c6d3c2; font: 9px/1.6 var(--mono); }
    .offer-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
    .offer-actions button { min-height: 34px; border: 1px solid var(--gold); background: #ffcf6e12; color: var(--gold); cursor: pointer; font: 9px var(--mono); }
    .offer-actions button:disabled { border-color: var(--line); color: #737c70; cursor: not-allowed; }
    .material-summary { padding-top: 12px; color: #bdc5b4; font: 10px/1.5 var(--mono); }
    .material-item { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 8px; padding: 9px 8px; border: 1px solid var(--line); background: #1c261e; }
    .material-item strong, .material-item span { display: block; }
    .material-item strong { font-size: 11px; }
    .material-item span { margin-top: 4px; color: var(--muted); font: 9px var(--mono); }
    .material-item .buy-button { min-width: 72px; font-size: 9px; }

    .rebirth-panel { border-color: #65583d; background: linear-gradient(135deg, #28291d, #1d231c); }
    .rebirth-panel .section-heading { border-color: #544b36; }
    .rebirth-panel .section-heading span { color: var(--gold); }
    .rebirth-copy { padding: 12px 0; color: #b7bba9; font-size: 11px; line-height: 1.55; }
    .rebirth-copy strong { color: var(--gold); font-family: var(--mono); font-weight: 500; }
    .progress-track { height: 4px; overflow: hidden; background: #494733; }
    .progress-fill { width: 0; height: 100%; background: var(--gold); transition: width .3s; }
    .rebirth-bottom { display: flex; justify-content: space-between; gap: 10px; margin: 8px 0 12px; color: var(--muted); font: 9px var(--mono); }
    .rebirth-button { width: 100%; min-height: 38px; border: 1px solid #8c7549; background: #ffcf6e12; color: var(--gold); cursor: pointer; font: 11px var(--mono); }
    .rebirth-button:hover:not(:disabled) { background: #ffcf6e24; }
    .rebirth-button:disabled { border-color: #4a4838; color: #817d69; cursor: not-allowed; }

    .history-panel { padding: 16px 18px; }
    .history-list { display: flex; flex-wrap: wrap; gap: 7px; min-height: 34px; padding-top: 12px; }
    .history-item { display: grid; place-items: center; width: 34px; height: 30px; border: 1px solid var(--line); color: #bdc5b4; font: 11px var(--mono); }
    .history-item.special { border-color: #7e7147; color: var(--gold); background: #ffcf6e0a; }
    .history-empty { align-self: center; color: var(--muted); font: 10px var(--mono); }
    .index-panel { padding: 16px 18px; }
    .rarity-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; padding-top: 12px; }
    .rarity-card { min-width: 0; padding: 10px 8px; border: 1px solid var(--line); background: #1c261e; }
    .rarity-card strong, .rarity-card span, .rarity-card p { display: block; margin: 0; }
    .rarity-card strong { font-size: 10px; }
    .rarity-card span { margin-top: 6px; color: var(--muted); font: 9px var(--mono); }
    .rarity-card p { margin-top: 9px; color: #bdc5b4; font-size: 10px; line-height: 1.4; }
    .rarity-card.common strong { color: #bdc5b4; }
    .rarity-card.uncommon strong { color: var(--mint); }
    .rarity-card.rare strong { color: #8bd9e1; }
    .rarity-card.epic strong { color: #d0b6ff; }
    .rarity-card.legendary strong { color: var(--coral); }
    .rarity-card.mythic strong { color: #d0b6ff; }
    .rarity-card.celestial strong { color: var(--mint); }
    .rarity-card.divine strong { color: var(--gold); }
    .oddity-list { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--line); }
    .oddity-list p { flex: 1 1 420px; margin: 0; color: #bdc5b4; font: 10px/1.8 var(--mono); }
    .oddity-list strong { color: var(--gold); font-weight: 500; }
    .animation-library { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
    .animation-heading { display: flex; justify-content: space-between; gap: 10px; color: var(--muted); font: 9px var(--mono); }
    .preview-actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .preview-button { display: block; padding: 7px 10px; border: 1px solid #9b7941; background: #ffcf6e12; color: var(--gold); cursor: pointer; font: 9px var(--mono); }
    .preview-button:hover:not(:disabled) { background: #ffcf6e24; }
    .preview-button:disabled { border-color: var(--line); color: #737c70; cursor: not-allowed; }
    .animation-list { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 8px; margin-top: 9px; }
    .animation-item { min-width: 0; padding: 9px 8px; border: 1px solid var(--line); background: #1c261e; }
    .animation-item strong, .animation-item span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .animation-item strong { color: var(--ink); font-size: 10px; }
    .animation-item span { margin-top: 4px; color: var(--muted); font: 9px var(--mono); }
    .animation-button { width: 100%; margin-top: 8px; padding: 6px 4px; border: 1px solid #64754d; background: transparent; color: var(--lime); cursor: pointer; font: 9px var(--mono); }
    .animation-button:disabled { border-color: var(--line); color: #737c70; cursor: not-allowed; }
    .animation-button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
    .settings-panel { padding: 17px; }
    .setting-row { display: flex; align-items: center; gap: 11px; margin-top: 14px; cursor: pointer; }
    .setting-row input { width: 17px; height: 17px; margin: 0; accent-color: var(--lime); }
    .setting-row strong, .setting-row small { display: block; }
    .setting-row strong { font-size: 12px; }
    .setting-row small { margin-top: 4px; color: var(--muted); font: 9px/1.5 var(--mono); }
    .screen-event { position: fixed; z-index: 20; inset: 0; display: grid; place-items: center; overflow: hidden; padding: 24px; background: #010203; opacity: 0; visibility: hidden; pointer-events: none; transition: opacity .12s, visibility .12s; }
    .screen-event.active { opacity: 1; visibility: visible; pointer-events: auto; }
    .screen-event::before { position: absolute; z-index: 0; inset: -55%; background: repeating-conic-gradient(from 7deg, transparent 0 8deg, #ffffff12 8.3deg 9deg, transparent 9.3deg 17deg); content: ""; opacity: .38; animation: eventRays 9s linear infinite; }
    .screen-event.active::after { position: absolute; z-index: 3; inset: 0; background: #fff; content: ""; opacity: 0; pointer-events: none; animation: cutFlash .38s steps(2,end) both; }
    .screen-event.event-7 { --event-accent: #ffcf6e; background: radial-gradient(ellipse at 50% 47%, #261b09 0, #080807 28%, #010203 72%); }
    .screen-event.event-13 { --event-accent: #ff6a58; background: radial-gradient(ellipse at 50% 47%, #280b0a 0, #090505 29%, #010203 72%); }
    .screen-event.event-42 { --event-accent: #84e6d2; background: radial-gradient(ellipse at 50% 47%, #09221f 0, #050908 30%, #010203 72%); }
    .screen-event.event-69 { --event-accent: #ff83be; background: radial-gradient(ellipse at 50% 47%, #260817 0, #0b0509 30%, #010203 72%); }
    .screen-event.event-100, .screen-event.event-777, .screen-event.event-1000 { --event-accent: #ffe7a0; background: radial-gradient(ellipse at 50% 47%, #30200a 0, #0b0804 29%, #010203 72%); }
    .screen-event.event-777 { --event-accent: #ffd447; background: radial-gradient(ellipse at 50% 47%, #493406 0, #120d03 29%, #010203 72%); }
    .screen-event.event-777 .event-title, .screen-event.event-777 .event-kicker { color: #ffdc57; text-shadow: 0 0 18px #ffbf24, 0 0 42px #ffbf2480; }
    .screen-event.event-777 .slot-machine { border-color: #ffd447; background: linear-gradient(145deg, #3c2c08, #070600 72%); box-shadow: 0 0 100px #ffd44788, inset 0 0 42px #ffd4472b; }
    .screen-event.event-777 .slot-brand, .screen-event.event-777 .slot-footer { color: #ffdc57; text-shadow: 0 0 12px #ffbf24; }
    .screen-event.event-777 .slot-reels { border-color: #ffe67b; box-shadow: 0 0 35px #ffdb5470; }
    .screen-event.event-777 .slot-strip span { color: #fff0a1; text-shadow: 0 0 18px #ffc72b, 0 0 40px #ffb700; }
    .screen-event.event-111 { --event-accent: #86e2b1; }
    .screen-event.event-222 { --event-accent: #8bd9e1; }
    .screen-event.event-333 { --event-accent: #c8e77e; }
    .screen-event.event-444 { --event-accent: #c4b1ff; }
    .screen-event.event-555 { --event-accent: #ffad84; }
    .screen-event.event-666 { --event-accent: #ff7068; }
    .screen-event.event-888 { --event-accent: #8cbeff; }
    .screen-event.event-999 { --event-accent: #fa93d2; }
    .event-panel { position: relative; z-index: 2; width: min(980px, 100%); padding: 34px 22px 26px; background: transparent; text-align: center; animation: eventEntrance .65s cubic-bezier(.18,.8,.25,1) both; }
    .event-777.active .event-panel { animation: eventEntrance .65s cubic-bezier(.18,.8,.25,1) both, eventShake .75s ease-in-out 1.25s 2; }
    .event-kicker { color: var(--event-accent); font: 12px var(--mono); }
    .event-title { margin: 12px 0 0; color: #f2f1e9; font-size: 58px; font-weight: 700; line-height: 1.05; }
    .event-description { max-width: 540px; margin: 14px auto 0; color: #c1c4b8; font: 12px/1.6 var(--mono); }
    .event-number { margin: 30px 0 24px; color: var(--event-accent); font-size: 190px; font-weight: 700; line-height: .85; font-variant-numeric: tabular-nums; text-shadow: 0 0 26px var(--event-accent), 0 0 90px color-mix(in srgb, var(--event-accent) 62%, transparent); animation: eventNumber .8s cubic-bezier(.18,.8,.25,1) both; }
    .event-13 .event-number { animation-name: eventGlitch; }
    .event-42 .event-number { animation-name: eventPortal; }
    .event-69 .event-number { animation-name: eventBounce; }
    .event-111 .event-number { animation-name: eventNumber; }
    .event-222 .event-number { animation-name: eventPortal; }
    .event-333 .event-number { animation-name: eventNova; }
    .event-444 .event-number { animation-name: eventGlitch; }
    .event-555 .event-number { animation-name: eventNova; }
    .event-666 .event-number { animation-name: eventGlitch; }
    .event-888 .event-number { animation-name: eventPortal; }
    .event-999 .event-number { animation-name: eventNova; }
    .slot-machine { width: min(560px, 100%); margin: 30px auto 20px; padding: 18px; border: 2px solid var(--event-accent); background: linear-gradient(145deg, #1c160b, #050605 72%); box-shadow: 0 0 70px #ffcf6e50, inset 0 0 30px #ffcf6e18; animation: machineImpact .7s cubic-bezier(.15,.8,.25,1) .25s both; }
    .slot-brand { margin-bottom: 14px; color: var(--event-accent); font: 11px var(--mono); }
    .slot-reels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 12px; border: 1px solid #aa8648; background: #020303; }
    .slot-window { height: 128px; overflow: hidden; border: 1px solid #584c34; background: repeating-linear-gradient(180deg, #11130e 0 64px, #252519 64px 128px); }
    .slot-strip { display: flex; height: 2000%; flex-direction: column; animation: slotSpin 2.35s cubic-bezier(.12,.72,.16,1) both; }
    .slot-strip span { display: grid; flex: 0 0 5%; place-items: center; height: 5%; color: #fff2c1; font: 700 88px var(--sans); text-shadow: 0 0 22px #ffcf6e; }
    .slot-window:nth-child(2) .slot-strip { animation-delay: .14s; }
    .slot-window:nth-child(3) .slot-strip { animation-delay: .3s; }
    .slot-window:nth-child(4) .slot-strip { animation-delay: .48s; }
    .slot-footer { margin-top: 13px; color: #e5d5aa; font: 10px var(--mono); }
    .event-particles { position: absolute; z-index: 1; inset: 0; overflow: hidden; pointer-events: none; }
    .event-particle { position: absolute; top: 50%; left: 50%; color: var(--event-accent); font-size: var(--particle-size, 22px); line-height: 1; text-shadow: 0 0 12px currentColor, 0 0 30px currentColor; transform: translate(-50%,-50%); animation: particleBlast 1.2s cubic-bezier(.14,.76,.22,1) both; }
    .event-777 .event-particle { color: #ffdf58; text-shadow: 0 0 16px #ffc400, 0 0 38px #ffc400; }
    .event-close { min-width: 190px; min-height: 46px; margin-top: 12px; border: 1px solid var(--event-accent, var(--lime)); background: #ffffff0b; color: var(--event-accent, var(--lime)); cursor: pointer; font: 11px var(--mono); }
    .event-close:hover { background: #ffffff1c; }
    .toast { position: fixed; z-index: 5; right: 22px; bottom: 20px; max-width: min(360px, calc(100% - 44px)); padding: 12px 16px; border: 1px solid var(--lime); background: var(--panel); color: var(--ink); font: 11px var(--mono); opacity: 0; transform: translateY(8px); pointer-events: none; transition: .2s; }
    .toast.show { opacity: 1; transform: translateY(0); }
    .footer { display: flex; justify-content: space-between; gap: 12px; padding: 17px 2px 0; color: #697367; font: 9px var(--mono); }

    @keyframes orbit { to { transform: rotate(360deg); } }
    @keyframes roll { 0% { transform: translateY(5px) scale(.96); filter: blur(3px); } 60% { transform: translateY(-3px) scale(1.03); filter: blur(0); } 100% { transform: translateY(0) scale(1); } }
    @keyframes jackpot { 0% { transform: scale(.68) rotate(-7deg); } 62% { transform: scale(1.12) rotate(3deg); } 100% { transform: scale(1) rotate(0); } }
    @keyframes glitch { 0%,100% { transform: translate(0); } 25% { transform: translate(-5px, 1px) skew(-4deg); } 50% { transform: translate(4px, -2px) skew(3deg); } 75% { transform: translate(-2px); } }
    @keyframes cosmic { 0% { transform: scale(.7); filter: blur(8px); } 55% { transform: scale(1.12); filter: blur(0); } 100% { transform: scale(1); } }
    @keyframes sevenSpark { 0% { transform: scale(.55) rotate(-18deg); filter: brightness(.7); } 55% { transform: scale(1.18) rotate(9deg); filter: brightness(1.8); } 100% { transform: scale(1) rotate(0); filter: brightness(1); } }
    @keyframes hexFlicker { 0%,100% { transform: translate(0); opacity: 1; } 20% { transform: translate(-7px, 1px) skew(-7deg); opacity: .35; } 45% { transform: translate(5px, -2px) skew(5deg); opacity: .9; } 70% { transform: translate(-2px); opacity: .5; } }
    @keyframes cosmicPulse { 0% { transform: scale(.3); filter: blur(12px); } 58% { transform: scale(1.2); filter: blur(0); } 78% { transform: scale(.94); } 100% { transform: scale(1); } }
    @keyframes doubleBounce { 0%,100% { transform: translateY(0) scale(1); } 28% { transform: translateY(-18px) scale(1.08); } 52% { transform: translateY(0) scale(.96); } 76% { transform: translateY(-9px) scale(1.03); } }
    @keyframes supernova { 0% { transform: scale(.15) rotate(-24deg); filter: brightness(.4) blur(10px); } 48% { transform: scale(1.3) rotate(8deg); filter: brightness(2.4) blur(0); } 72% { transform: scale(.92) rotate(-3deg); filter: brightness(1.5); } 100% { transform: scale(1) rotate(0); filter: brightness(1); } }
    @keyframes oneHundred { 0% { transform: scale(.2); filter: brightness(3) blur(8px); opacity: .2; } 55% { transform: scale(1.28); filter: brightness(2); opacity: 1; } 100% { transform: scale(1); filter: brightness(1); } }
    @keyframes eventRays { to { transform: rotate(360deg); } }
    @keyframes eventEntrance { from { transform: translateY(22px) scale(.92); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes eventNumber { 0% { transform: scale(.2) rotate(-16deg); filter: blur(9px); } 65% { transform: scale(1.17) rotate(4deg); filter: blur(0); } 100% { transform: scale(1); } }
    @keyframes eventGlitch { 0%,100% { transform: translate(0) skew(0); } 15% { transform: translate(-10px, 2px) skew(-8deg); } 35% { transform: translate(8px, -2px) skew(6deg); } 58% { transform: translate(-4px) skew(-3deg); } 78% { transform: translate(3px); } }
    @keyframes eventPortal { 0% { transform: scale(.12) rotate(-90deg); filter: blur(12px); } 72% { transform: scale(1.12) rotate(8deg); filter: blur(0); } 100% { transform: scale(1) rotate(0); } }
    @keyframes eventBounce { 0%,100% { transform: translateY(0) scale(1); } 28% { transform: translateY(-24px) scale(1.12); } 52% { transform: translateY(0) scale(.92); } 76% { transform: translateY(-12px) scale(1.05); } }
    @keyframes eventNova { 0% { transform: scale(.05) rotate(-30deg); filter: brightness(4) blur(18px); } 50% { transform: scale(1.35) rotate(7deg); filter: brightness(2.8) blur(0); } 78% { transform: scale(.92) rotate(-2deg); filter: brightness(1.5); } 100% { transform: scale(1); filter: brightness(1); } }
    @keyframes slotSpin { 0% { transform: translateY(0); } 66% { transform: translateY(-72%); } 82% { transform: translateY(-88%); } 93% { transform: translateY(-94.2%); } 100% { transform: translateY(-95%); } }
    @keyframes cutFlash { 0% { opacity: .92; } 100% { opacity: 0; } }
    @keyframes eventShake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); } 60% { transform: translateX(-5px); } 80% { transform: translateX(3px); } }
    @keyframes machineImpact { 0% { transform: translateY(35px) scale(.72) rotateX(16deg); opacity: 0; } 65% { transform: translateY(-7px) scale(1.04); opacity: 1; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes particleBlast { 0% { transform: translate(-50%,-50%) scale(.1); opacity: 0; } 12% { opacity: 1; } 100% { transform: translate(calc(-50% + var(--particle-x)),calc(-50% + var(--particle-y))) rotate(32deg) scale(.05); opacity: 0; } }
    @keyframes firstLight { 0% { transform: scale(.3); filter: brightness(3); opacity: 0; } 100% { transform: scale(1); filter: brightness(1); opacity: 1; } }
    @keyframes twinOrbit { from { transform: rotate(-22deg) scale(.55); } to { transform: rotate(338deg) scale(1); } }
    @keyframes emeraldWave { 0% { transform: scale(.2); filter: hue-rotate(-45deg) brightness(2); } 60% { transform: scale(1.2); } 100% { transform: scale(1); filter: hue-rotate(0) brightness(1); } }
    @keyframes fourfoldWave { 0%,100% { transform: skew(0) scale(1); } 25% { transform: skew(-9deg) scale(1.12); } 50% { transform: skew(8deg) scale(.94); } 75% { transform: skew(-4deg) scale(1.06); } }
    @keyframes wildfire { 0% { transform: translateY(30px) scale(.7); filter: brightness(3) blur(8px); } 55% { transform: translateY(-10px) scale(1.18); filter: brightness(2); } 100% { transform: translateY(0) scale(1); filter: brightness(1); } }
    @keyframes goldRain { 0% { transform: translateY(-30px) scale(.6); filter: brightness(4); } 35% { transform: translateY(8px) scale(1.18); } 68% { transform: translateY(-4px) scale(.95); filter: brightness(2); } 100% { transform: translateY(0) scale(1); filter: brightness(1); } }
    @keyframes divineNova { 0% { transform: scale(.02) rotate(-45deg); filter: brightness(5) blur(18px); } 55% { transform: scale(1.4) rotate(12deg); filter: brightness(3) blur(0); } 80% { transform: scale(.92) rotate(-4deg); } 100% { transform: scale(1) rotate(0); filter: brightness(1); } }
    .result-number.passive-111 { animation: firstLight .85s cubic-bezier(.18,.8,.25,1); }
    .result-number.passive-222 { animation: twinOrbit 1.1s cubic-bezier(.2,.75,.2,1); }
    .result-number.passive-333 { animation: emeraldWave .9s ease-out; }
    .result-number.passive-444 { animation: fourfoldWave .85s ease-in-out; }
    .result-number.passive-555 { animation: wildfire 1s cubic-bezier(.16,.8,.24,1); }
    .result-number.passive-666 { animation: glitch .75s steps(2,end); }
    .result-number.event-777, .result-number.passive-777 { color: #ffdf58; text-shadow: 0 0 24px #ffc400, 0 0 70px #ffb700; animation: goldRain 1.2s cubic-bezier(.14,.8,.24,1); }
    .result-number.passive-888 { animation: cosmicPulse 1.1s ease-out; }
    .result-number.passive-999 { animation: supernova 1.25s cubic-bezier(.15,.75,.2,1); }
    .result-number.event-1000, .result-number.passive-1000 { color: #fff0b0; text-shadow: 0 0 32px #ffcf6e, 0 0 90px #ff846c; animation: divineNova 1.5s cubic-bezier(.15,.75,.2,1); }
